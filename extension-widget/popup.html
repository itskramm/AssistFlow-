<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssistFlow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.9;
      margin-bottom: 16px;
    }

    .info {
      background: rgba(255, 255, 255, 0.2);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }

    .info strong {
      display: block;
      margin-bottom: 4px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: white;
      color: #667eea;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.02);
    }

    .status {
      text-align: center;
      font-size: 12px;
      margin-top: 12px;
      opacity: 0.8;
    }

    .status.online {
      color: #90EE90;
    }

    .status.offline {
      color: #FFB6C1;
    }
  </style>
</head>
<body>
  <h1>🤖 AssistFlow</h1>
  <p>Your AI workplace assistant is ready to help on any webpage!</p>
  
  <div class="info">
    <strong>How to use:</strong>
    Look for the 💬 button in the bottom-right corner of any webpage. Click it to start chatting!
  </div>

  <button id="openChat">Open Assistant</button>
  
  <div class="status" id="status">Checking connection...</div>

  <script src="popup.js"></script>
</body>
</html>
