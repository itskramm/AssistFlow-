<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartOpsSupportHub</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --bg-input: #f4f4f5;
      --bg-hover: #f4f4f5;
      --border: #e4e4e7;
      --text: #0d0d0d;
      --muted: #6b7280;
      --accent: #10a37f;
      --accent-hover: #0d8f6f;
      --user: #f4f4f5;
      --error-bg: #fef2f2;
      --error-text: #b91c1c;
      --offline-bg: #fefce8;
      --offline-text: #a16207;
    }

    html.dark {
      color-scheme: dark;
      --bg: #212121;
      --bg-input: #3f3f3f;
      --bg-hover: #3f3f3f;
      --border: #444444;
      --text: #ececec;
      --muted: #a1a1aa;
      --accent: #19c37d;
      --accent-hover: #15a86a;
      --user: #2f2f2f;
      --error-bg: #450a0a;
      --error-text: #fca5a5;
      --offline-bg: #451a03;
      --offline-text: #fde68a;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 6px; }
    html.dark ::-webkit-scrollbar-thumb { background: #52525b; }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .header-logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .header-title {
      margin: 0 0 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .status-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 600;
    }

    .status-pill.online { background: #dcfce7; color: #166534; }
    .status-pill.offline { background: #fee2e2; color: #991b1b; }
    html.dark .status-pill.online { background: #14532d; color: #86efac; }
    html.dark .status-pill.offline { background: #450a0a; color: #fca5a5; }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s;
    }

    .icon-btn:hover { background: var(--bg-hover); }

    .chat-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 14px 8px;
    }

    .welcome-card {
      margin-bottom: 14px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg-input);
    }

    .welcome-card h2 {
      margin: 0 0 5px;
      font-size: 1rem;
    }

    .welcome-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .faq-heading {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .faq-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .faq-button {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 0.8rem;
      text-align: left;
      transition: border-color 0.15s, background 0.15s;
    }

    .faq-button:hover {
      border-color: var(--accent);
      background: var(--bg-hover);
    }

    .message-row {
      display: flex;
      margin: 10px 0;
      animation: message-in 0.18s ease-out;
    }

    @keyframes message-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user { justify-content: flex-end; }
    .message-row.assistant { justify-content: flex-start; gap: 8px; align-items: flex-start; }

    .message-avatar {
      width: 26px;
      height: 26px;
      margin-top: 3px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .message-bubble {
      max-width: 84%;
      padding: 9px 12px;
      border-radius: 14px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-line;
    }

    .message-row.user .message-bubble {
      background: var(--accent);
      color: #fff;
      border-radius: 14px 14px 4px 14px;
    }

    .message-row.assistant .message-bubble {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 14px 14px 14px 4px;
    }

    .message-bubble.system {
      max-width: 100%;
      background: var(--error-bg);
      border-color: var(--error-text);
      color: var(--error-text);
      font-size: 0.82rem;
    }

    .source-badge {
      display: inline-block;
      margin-top: 7px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--offline-bg);
      color: var(--offline-text);
      font-size: 0.66rem;
      font-weight: 600;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 7px 2px;
    }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    .composer {
      padding: 10px 14px 14px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    .composer-form {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 5px 5px 13px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg-input);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .composer-form:focus-within {
      border-color: var(--accent);
      box-shadow: 0 1px 10px rgba(16, 163, 127, 0.14);
    }

    .composer-input {
      min-width: 0;
      flex: 1;
      padding: 8px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
    }

    .composer-input::placeholder { color: var(--muted); }
    .composer-input:disabled { opacity: 0.6; }

    .send-button {
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 700;
      display: grid;
      place-items: center;
      transition: background 0.15s, transform 0.15s;
    }

    .send-button:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .send-button:disabled { opacity: 0.35; cursor: not-allowed; }

    .composer-hint {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.67rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="sidebar-header">
      <div class="header-left">
        <img class="header-logo" src="icons/icon48.png" alt="SmartOpsSupportHub">
        <div>
          <p class="header-title">SmartOpsSupportHub</p>
          <span class="status-pill offline" id="statusBadge">Checking...</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="newChatButton" type="button" title="New chat" aria-label="New chat">✎</button>
        <button class="icon-btn" id="themeButton" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">☾</button>
      </div>
    </header>

    <main class="chat-container" id="chatContainer">
      <section class="welcome-card">
        <h2>How can I help?</h2>
        <p>Ask about SOPs, troubleshooting, or any workplace procedure.</p>
      </section>

      <p class="faq-heading">FAQ · Common procedures</p>
      <div class="faq-list" id="faqList"></div>
    </main>

    <footer class="composer">
      <form class="composer-form" id="messageForm">
        <input
          class="composer-input"
          id="messageInput"
          type="text"
          placeholder="Ask a question..."
          autocomplete="off"
          aria-label="Question"
        >
        <button class="send-button" id="sendButton" type="submit" aria-label="Send">↑</button>
      </form>
      <p class="composer-hint">SmartOpsSupportHub can make mistakes. Verify critical procedures.</p>
    </footer>
  </div>

  <script src="faq.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
