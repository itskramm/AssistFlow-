<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssistFlow Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #667eea;
      --primary-dark: #764ba2;
      --text: #1a1a1a;
      --text-secondary: #666;
      --bg: #ffffff;
      --bg-secondary: #f5f5f5;
      --border: #e0e0e0;
      --bubble-user: #667eea;
      --bubble-assistant: #f0f0f0;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      padding: 16px 20px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 13px;
      opacity: 0.9;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.2);
      margin-top: 8px;
    }

    .status-badge.online {
      background: rgba(76, 175, 80, 0.3);
    }

    .status-badge.offline {
      background: rgba(244, 67, 54, 0.3);
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message-row {
      display: flex;
      animation: slideIn 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      word-wrap: break-word;
      line-height: 1.5;
      font-size: 14px;
    }

    .message-row.user .message-bubble {
      background: var(--bubble-user);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message-row.assistant .message-bubble {
      background: var(--bubble-assistant);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .message-bubble.system {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      text-align: center;
      font-size: 13px;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: var(--bubble-assistant);
      border-radius: 18px;
      width: fit-content;
      border-bottom-left-radius: 4px;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: var(--text-secondary);
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }

    .source-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 11px;
      margin-top: 6px;
      background: rgba(0, 0, 0, 0.1);
    }

    .composer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    .composer-form {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .composer-input {
      flex: 1;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text);
      font-size: 14px;
      padding: 12px 16px;
      border-radius: 24px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .composer-input:focus {
      border-color: var(--primary);
      background: var(--bg);
    }

    .composer-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .send-button {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .send-button:hover:not(:disabled) {
      transform: scale(1.05);
      background: var(--primary-dark);
    }

    .send-button:active:not(:disabled) {
      transform: scale(0.95);
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .welcome-card {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .welcome-card h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .welcome-card p {
      font-size: 14px;
      opacity: 0.9;
      line-height: 1.5;
    }

    .quick-topics {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }

    .topic-button {
      padding: 10px 14px;
      background: rgba(102, 126, 234, 0.1);
      border: 1px solid rgba(102, 126, 234, 0.3);
      border-radius: 8px;
      color: var(--primary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }

    .topic-button:hover {
      background: rgba(102, 126, 234, 0.2);
      transform: translateY(-1px);
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">🤖 AssistFlow</div>
    <div class="header-subtitle">AI-Powered Workplace Support</div>
    <span class="status-badge" id="statusBadge">Checking...</span>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="welcome-card">
      <h2>Welcome to AssistFlow</h2>
      <p>I can help with troubleshooting, SOPs, and workplace procedures. Ask me anything!</p>
    </div>

    <div class="quick-topics">
      <button class="topic-button" data-topic="How do I reset my CRM password?">
        🔑 CRM Password Reset
      </button>
      <button class="topic-button" data-topic="Call quality issues">
        📞 Call Quality Issues
      </button>
      <button class="topic-button" data-topic="How do I escalate a ticket?">
        📋 Ticket Escalation
      </button>
      <button class="topic-button" data-topic="Customer identity verification">
        🆔 Identity Verification
      </button>
    </div>
  </div>

  <div class="composer">
    <form class="composer-form" id="messageForm">
      <input
        type="text"
        class="composer-input"
        id="messageInput"
        placeholder="Ask a question..."
        autocomplete="off"
      />
      <button type="submit" class="send-button" id="sendButton">
        ↑
      </button>
    </form>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
